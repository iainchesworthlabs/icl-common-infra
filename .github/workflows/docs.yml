name: Docs

# Reusable. Builds the MkDocs Material site with --strict. With `deploy: true` it also
# publishes to GitHub Pages (the repository's Pages build type must be "GitHub Actions").
# Callers build on pull requests (deploy false) and deploy on the push the release bot
# makes to `main`, so the published site always matches the latest release. Pushes made
# with an App token start workflows; pushes made with GITHUB_TOKEN do not.

on:
  workflow_call:
    inputs:
      requirements:
        description: Repository path of the pip requirements file for the docs tooling.
        type: string
        default: requirements/docs.txt
      deploy:
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}

      - name: Install the docs tooling
        shell: bash
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: python3 -m pip install --quiet -r "$REQUIREMENTS"

      - name: Build
        shell: bash
        run: mkdocs build --strict --site-dir site

      - name: Upload the site
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
