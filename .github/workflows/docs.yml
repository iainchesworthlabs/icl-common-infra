name: Docs

# Reusable. Builds the MkDocs Material site with --strict. With `upload: true` it also
# uploads the site as the Pages artifact. Publishing is a separate workflow, docs-deploy.yml,
# so that a caller's build job needs only `contents: read`: a called workflow that contains a
# job asking for `pages: write` fails to start unless the calling job grants it, even when the
# job is skipped. Callers build on pull requests and, on the push the release bot makes to
# `main`, build with `upload: true` and then call docs-deploy.yml. Pushes made with an App
# token start workflows; pushes made with GITHUB_TOKEN do not.

on:
  workflow_call:
    inputs:
      requirements:
        description: Repository path of the pip requirements file for the docs tooling.
        type: string
        default: requirements/docs.txt
      upload:
        description: Upload the built site as the Pages artifact for docs-deploy.yml.
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}

      - name: Install the docs tooling
        shell: bash
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: python3 -m pip install --quiet -r "$REQUIREMENTS"

      - name: Build
        shell: bash
        run: mkdocs build --strict --site-dir site

      - name: Upload the site
        if: inputs.upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
