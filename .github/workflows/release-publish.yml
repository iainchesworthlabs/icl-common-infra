name: Release publish

# Reusable. The project-independent half of a release. The caller's own release workflow
# builds and platform-signs the packages first and uploads them as workflow artifacts
# whose names start with `release-`; this workflow then:
#
#   verify    the tag is semver, points at a commit on develop, and the release has notes
#   publish   SHA-512 sums, detached GPG signatures (checked against the public key committed
#             in the repository), SPDX SBOM, build-provenance attestations, an optional
#             project verification script, GitHub Release (pre-release when the tag has a
#             suffix; a draft when asked). A project that makes its own SBOMs, or writes its
#             own release notes from the signed files, says so with `pre-release-script`,
#             `spdx-sbom`, `cyclonedx-sbom` and `notes-script`.
#   promote   fast-forwards `main` to the tag with the release bot, for final releases
#
# The publish job runs in the `release` environment, so the owner approves each release.
# Missing secrets fail the run early with a message listing which are missing.

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Name pattern of the workflow artifacts that hold the packages.
        type: string
        default: "release-*"
      default-branch:
        type: string
        default: develop
      release-branch:
        type: string
        default: main
      generate-sbom:
        description: >-
          Generate an SPDX SBOM of the repository. Set false when the packages already include
          the project's own SBOM files.
        type: boolean
        default: true
      public-key:
        description: >-
          Path of the committed public release key. Every signature is verified against it and
          the signing key must be the same key.
        type: string
        default: docs/signing-key.asc
      verify-script:
        description: >-
          Optional path of a script in the repository, run as `script <directory> <public-key>`
          on the signed files after they are attested (up to four attempts, because a new
          attestation can take a moment to be readable). A failure stops the release.
        type: string
        default: ""
      pre-release-script:
        description: >-
          Optional path of a script in the repository, run as `bash script <dist> <version> <tag>`
          after the packages are downloaded and before the checksums are written. It may add files
          to <dist> (the project's SBOMs, its public key); they are summed, signed and published
          with the packages. <version> has no leading v.
        type: string
        default: ""
      spdx-sbom:
        description: >-
          File name, in the packages directory, of an SPDX SBOM that pre-release-script wrote. It
          is attested as an SBOM for every package and read back: the document the attestation
          holds must equal the file. Empty for none.
        type: string
        default: ""
      cyclonedx-sbom:
        description: Same as spdx-sbom, for a CycloneDX document.
        type: string
        default: ""
      notes-script:
        description: >-
          Optional path of a script in the repository, run as
          `bash script <dist> <output-file> <version> <tag> <signed>` after signing, attestation
          and verification, that writes the release notes (<signed> is always `true` here). It
          replaces the changelog-based notes of the release-notes action, in the verify job as
          well as the publish job, for a project whose notes list the signed files and how to
          check them. The script must fail when it has no notes to write.
        type: string
        default: ""
      draft:
        description: Create the GitHub Release as a draft that the owner publishes.
        type: boolean
        default: false
      title:
        description: Release title. The tag when empty.
        type: string
        default: ""
    secrets:
      REPO_GPG_PRIVATE_KEY:
        required: false
      REPO_GPG_PASSPHRASE:
        required: false
      RELEASE_BOT_APP_ID:
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$TAG does not point at a commit on $DEFAULT_BRANCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the release has notes
        if: inputs.notes-script == ''
        uses: $/actions/release-notes
        with:
          version: ${{ steps.check.outputs.version }}
          prerelease: ${{ steps.check.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes-check.md

  publish:
    name: Sign and publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check secrets
        shell: bash
        env:
          GPG_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "$GPG_KEY" ]; then missing+=(REPO_GPG_PRIVATE_KEY); fi
          if [ -z "$GPG_PASS" ]; then missing+=(REPO_GPG_PASSPHRASE); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing organisation secrets: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: dist
          merge-multiple: true

      - name: Run the project's pre-release script
        if: inputs.pre-release-script != ''
        shell: bash
        env:
          SCRIPT: ${{ inputs.pre-release-script }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::pre-release-script $SCRIPT does not exist"
            exit 1
          fi
          bash "$SCRIPT" dist "$VERSION" "$TAG"

      - name: Check the SBOM files exist
        if: inputs.spdx-sbom != '' || inputs.cyclonedx-sbom != ''
        shell: bash
        env:
          SPDX: ${{ inputs.spdx-sbom }}
          CYCLONEDX: ${{ inputs.cyclonedx-sbom }}
        run: |
          set -euo pipefail
          for f in "$SPDX" "$CYCLONEDX"; do
            if [ -n "$f" ] && [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f is not there: pre-release-script has to write it"
              exit 1
            fi
          done

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          test -n "$(ls -A .)" || { echo "::error::no packages were uploaded"; exit 1; }
          find . -maxdepth 1 -type f ! -name 'SHA512SUMS*' ! -name '*.asc' -printf '%f\n' | LC_ALL=C sort \
            | xargs sha512sum > SHA512SUMS
          cat SHA512SUMS

      - name: SBOM
        if: inputs.generate-sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign with GPG
        shell: bash
        env:
          GPG_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "Signing with key $fpr"
          cd dist
          find . -maxdepth 1 -type f ! -name '*.asc' -printf '%f\n' | while IFS= read -r f; do
            printf '%s' "$GPG_PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --local-user "$fpr" --output "$f.asc" "$f"
          done
          gpg --batch --verify SHA512SUMS.asc SHA512SUMS
          rm -rf "$GNUPGHOME"

      - name: Check the signatures against the committed public key
        shell: bash
        env:
          PUBLIC_KEY: ${{ inputs.public-key }}
        run: |
          set -euo pipefail
          if [ ! -f "$PUBLIC_KEY" ]; then
            echo "::error::$PUBLIC_KEY is missing. Commit the public release key there (docs/releasing.md)."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg-verify"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$PUBLIC_KEY"
          cd dist
          count=0
          for sig in *.asc; do
            status="$(gpg --batch --status-fd 1 --verify "$sig" "${sig%.asc}" 2>/dev/null || true)"
            if ! grep -q '^\[GNUPG:\] GOODSIG' <<< "$status"; then
              echo "::error::$sig does not verify against $PUBLIC_KEY"
              exit 1
            fi
            count=$((count + 1))
          done
          echo "$count signatures verify against $PUBLIC_KEY"
          rm -rf "$GNUPGHOME"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            !dist/*.asc

      - name: Select the packages the SBOMs describe
        id: packages
        if: inputs.spdx-sbom != '' || inputs.cyclonedx-sbom != ''
        shell: bash
        env:
          SPDX: ${{ inputs.spdx-sbom }}
          CYCLONEDX: ${{ inputs.cyclonedx-sbom }}
        run: |
          set -euo pipefail
          # Every file but the sums, the signatures, the SBOMs and the generated SBOM.
          subjects="$(cd dist && find . -maxdepth 1 -type f \
            ! -name 'SHA512SUMS*' ! -name '*.asc' ! -name 'sbom.spdx.json' \
            ! -name "${SPDX:-.none}" ! -name "${CYCLONEDX:-.none}" -printf 'dist/%f\n' | LC_ALL=C sort)"
          test -n "$subjects" || { echo "::error::no package to attach the SBOMs to"; exit 1; }
          {
            echo 'subjects<<EOF'
            echo "$subjects"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$subjects"

      - name: Attest the SPDX SBOM
        if: inputs.spdx-sbom != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.packages.outputs.subjects }}
          sbom-path: dist/${{ inputs.spdx-sbom }}

      - name: Attest the CycloneDX SBOM
        if: inputs.cyclonedx-sbom != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.packages.outputs.subjects }}
          sbom-path: dist/${{ inputs.cyclonedx-sbom }}

      - name: Read the attestations back
        if: inputs.spdx-sbom != '' || inputs.cyclonedx-sbom != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SPDX: ${{ inputs.spdx-sbom }}
          CYCLONEDX: ${{ inputs.cyclonedx-sbom }}
          SUBJECTS: ${{ steps.packages.outputs.subjects }}
        run: |
          set -euo pipefail
          # A new attestation can take a moment to be readable.
          retry() {
            for _ in 1 2 3 4 5 6; do
              if "$@"; then return 0; fi
              sleep 10
            done
            return 1
          }
          first=""
          while IFS= read -r f; do
            if [ -z "$first" ]; then first="$f"; fi
            if ! retry gh attestation verify "$f" --repo "$REPO" > /dev/null 2>&1; then
              echo "::error::no verifiable attestation for $f"
              exit 1
            fi
            echo "attested: $f"
          done <<< "$SUBJECTS"
          # The SBOM an attestation holds must be the file that is published.
          check_sbom() {
            local predicate="$1" file="$2" ok=false
            for _ in 1 2 3 4 5 6; do
              if gh attestation verify "$first" --repo "$REPO" --predicate-type "$predicate" \
                   --format json --jq '.[0].verificationResult.statement.predicate' > "$RUNNER_TEMP/attested.json"; then
                ok=true
                break
              fi
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::no verifiable $predicate attestation for $first"
              exit 1
            fi
            if ! diff <(jq -S . "$RUNNER_TEMP/attested.json") <(jq -S . "dist/$file") > /dev/null; then
              echo "::error::the $predicate document attested for $first is not dist/$file"
              exit 1
            fi
            echo "attested and identical: $file"
          }
          if [ -n "$SPDX" ]; then check_sbom https://spdx.dev/Document/v2.3 "$SPDX"; fi
          if [ -n "$CYCLONEDX" ]; then check_sbom https://cyclonedx.org/bom "$CYCLONEDX"; fi

      - name: Run the project's verification
        if: inputs.verify-script != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ inputs.verify-script }}
          PUBLIC_KEY: ${{ inputs.public-key }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if bash "$SCRIPT" dist "$PUBLIC_KEY"; then exit 0; fi
            echo "verification failed (attempt $attempt of 4)"
            sleep 20
          done
          exit 1

      - name: Release notes
        if: inputs.notes-script == ''
        uses: $/actions/release-notes
        with:
          version: ${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md
          link-base: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/

      - name: Release notes from the project's script
        if: inputs.notes-script != ''
        shell: bash
        env:
          SCRIPT: ${{ inputs.notes-script }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::notes-script $SCRIPT does not exist"
            exit 1
          fi
          bash "$SCRIPT" dist "$RUNNER_TEMP/notes.md" "$VERSION" "$TAG" true
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::notes-script wrote no notes"; exit 1; }

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "${TITLE:-$TAG}" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "$TAG" dist/* "${flags[@]}"

  promote:
    name: Fast-forward release branch
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create a token for the release bot
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Fast-forward
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.release-branch }}
        run: |
          set -euo pipefail
          # A push made with an App token starts workflows (the docs deploy is triggered
          # by it); one made with GITHUB_TOKEN would not.
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$GITHUB_SHA" -F force=false
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA"
          fi
          echo "$BRANCH is now at $GITHUB_SHA"
