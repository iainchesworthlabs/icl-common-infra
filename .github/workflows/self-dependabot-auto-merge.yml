name: Dependabot auto-merge (this repository)

# Calls this repository's own reusable workflow of the same name from the pull request
# trigger, so Dependabot's updates here reach the merge queue the way they do in a consumer.
# The reference is local, so a change to the reusable workflow is tried on its own pull
# request before a consumer pins it. Needs the Dependabot secret MERGE_QUEUE_TOKEN
# (docs/secrets.md).

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dependabot-auto-merge.yml
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
