name: Build and test

# Reusable. Builds and tests a list of legs with CMake presets.
#
# `legs` is a JSON array. Each leg:
#   name              job name and cache lineage (required)
#   runner            array of runner labels, for example ["ubuntu-24.04"] (required)
#   preset            CMake configure and build preset (required)
#   build_dir         build directory; default build/<preset>
#   config            configuration for multi-config generators, for example Release
#   tests             false to build without running tests; default true
#   qt                true to install Qt (version from .github/toolchain-versions.json)
#   qt_modules        extra Qt modules, space separated
#   msvc              true to load the MSVC developer environment (checks the `msvc_toolset` pin)
#   compiler          gcc or clang: installs the GCC (`gcc` pin) or Clang (`llvm` pin) of
#                     .github/toolchain-versions.json and sets CC and CXX. A clang leg also installs
#                     GCC, because Clang takes its C++ library from the newest libstdc++.
#   experimental      true for a leg that reports but cannot fail the run (a preview toolchain)
#   emscripten        true to install Emscripten
#   toolchain_script  repository path of a script that installs the compiler (runs first)
#   vcpkg_features    manifest features this leg enables; also names the vcpkg cache lineage
#   phases_file       repository path of a ctest phases JSON file
#
# Secrets are not passed. A leg that needs one belongs in the release workflow.

on:
  workflow_call:
    inputs:
      legs:
        description: JSON array of legs, see the header of this file.
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 90

permissions: {}

jobs:
  leg:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the compiler
        if: matrix.toolchain_script != ''
        shell: bash
        env:
          SCRIPT: ${{ matrix.toolchain_script }}
        run: bash "$SCRIPT"

      - name: Install GCC
        if: matrix.compiler == 'gcc' || matrix.compiler == 'clang'
        uses: $/actions/setup-gcc
        with:
          export-compiler: ${{ matrix.compiler == 'gcc' }}

      - name: Install Clang
        if: matrix.compiler == 'clang'
        uses: $/actions/setup-llvm

      - name: Load the MSVC environment
        if: matrix.msvc == true
        uses: $/actions/setup-msvc-env

      - name: Install Emscripten
        if: matrix.emscripten == true
        uses: $/actions/setup-emscripten

      - name: Set up CMake
        uses: $/actions/setup-cmake

      - name: Read toolchain versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          qt=""; aqt=""
          if [ -f .github/toolchain-versions.json ]; then
            qt="$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json')).get('qt',''))")"
            aqt="$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json')).get('aqtsource',''))")"
          fi
          echo "qt=$qt" >> "$GITHUB_OUTPUT"
          echo "aqtsource=$aqt" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        if: matrix.qt == true
        uses: $/actions/setup-qt
        with:
          version: ${{ steps.versions.outputs.qt }}
          modules: ${{ matrix.qt_modules }}
          aqtsource: ${{ runner.os == 'Windows' && steps.versions.outputs.aqtsource || '' }}

      - name: Set up vcpkg
        uses: $/actions/setup-vcpkg
        with:
          cache-key-suffix: ${{ matrix.vcpkg_features }}

      - name: Set up ccache
        uses: $/actions/setup-ccache
        with:
          key: ${{ matrix.name }}

      - name: Report the compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CXX:-}" ]; then "$CXX" --version | head -2
          elif [ "$RUNNER_OS" = Windows ]; then cl 2>&1 | head -1
          else c++ --version | head -2
          fi

      - name: Configure
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          FEATURES: ${{ matrix.vcpkg_features }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$FEATURES" ]; then args+=("-DVCPKG_MANIFEST_FEATURES=$FEATURES"); fi
          # bash 3.2 (macOS) fails on an empty array under set -u, hence the + form.
          cmake --preset "$PRESET" ${args[@]+"${args[@]}"}

      - name: Build
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          cmake --build --preset "$PRESET" ${args[@]+"${args[@]}"}

      - name: Test
        if: matrix.tests != false
        uses: $/actions/run-ctest
        with:
          build-dir: ${{ matrix.build_dir || format('build/{0}', matrix.preset) }}
          config: ${{ matrix.config }}
          phases-file: ${{ matrix.phases_file }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            ${{ matrix.build_dir || format('build/{0}', matrix.preset) }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_SAVE_KEY }}

      - name: Save vcpkg caches
        if: always()
        continue-on-error: true
        uses: $/actions/save-vcpkg-cache
