name: zizmor

# Reusable. Static analysis of the repository's workflows and actions (template injection,
# unpinned actions, excessive permissions, credential persistence). Findings go to code
# scanning when the repository has it; the job also fails on findings of medium severity
# and above.
#
# The version of zizmor is the caller's: a `zizmor==X` line in its requirements file
# (`ci/requirements-zizmor.txt` by default), which Dependabot's pip ecosystem for that
# directory keeps current. A repository without the file gets the version pinned below,
# which only moves with this repository.

on:
  workflow_call:
    inputs:
      min-severity:
        type: string
        default: medium
      requirements-file:
        description: Requirements file of the caller that pins zizmor.
        type: string
        default: ci/requirements-zizmor.txt

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        shell: bash
        env:
          MIN_SEVERITY: ${{ inputs.min-severity }}
          REQUIREMENTS: ${{ inputs.requirements-file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "$REQUIREMENTS" ]; then
            python3 -m pip install --quiet -r "$REQUIREMENTS"
          else
            python3 -m pip install --quiet "zizmor==1.31.1"
          fi
          zizmor --version
          zizmor --min-severity "$MIN_SEVERITY" --format plain .
