name: Setup LLVM
description: >-
  Install the LLVM/Clang major version pinned in .github/toolchain-versions.json (key `llvm`) on an
  Ubuntu runner, with lld, llvm-symbolizer, clang-tidy and the sanitizer runtimes, and set CC and CXX
  to it. Other systems and an empty pin are left alone. The standard's floor is Clang 23, which
  comes from apt.llvm.org until Ubuntu carries it. Clang uses the newest libstdc++ installed, so a
  job that needs the C++23 library installs GCC with setup-gcc first.

inputs:
  version:
    description: LLVM major version. Empty reads the `llvm` key of .github/toolchain-versions.json.
    default: ""

runs:
  using: composite
  steps:
    - name: Read the pin
      id: pin
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        file=.github/toolchain-versions.json
        if [ -z "$VERSION" ] && [ -f "$file" ]; then
          VERSION="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('llvm', ''))" "$file")"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "debdir=$HOME/.cache/icl-apt/llvm-$VERSION" >> "$GITHUB_OUTPUT"
        # Made here, as the runner user: if the install script (root) created ~/.cache first, vcpkg could not make its own directory in it.
        if [ -n "$VERSION" ]; then mkdir -p "$HOME/.cache/icl-apt/llvm-$VERSION"; fi

    # The installed packages are cached, so a job installs without apt-get update or a download from the mirrors
    # (apt.llvm.org and archive.ubuntu.com failed whole runs on 10 November 2026). Only a push to the default branch,
    # a manual run or a schedule saves it; the key names the runner image, or the week, because a new image changes the dependencies.
    # `${{ env.ImageVersion }}` is empty in an expression (the env context holds only what a workflow sets; on a hosted
    # ubuntu-24.04 runner the expression gave nothing and the shell variable gave 20261122.23.1), so the key never named an
    # image. The shell variable is read here. A runner image that has none (a self-hosted fleet's) gets the ISO week: an
    # entry is renewed every week and is never older than one, where an entry under a fixed key would stay for ever.
    - name: Name the package cache
      id: aptkey
      if: runner.os == 'Linux' && steps.pin.outputs.version != ''
      shell: bash
      run: |
        set -euo pipefail
        echo "image=${ImageVersion:-week-$(date -u +%G-%V)}" >> "$GITHUB_OUTPUT"

    - name: Restore the package cache
      id: debs
      if: runner.os == 'Linux' && steps.pin.outputs.version != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pin.outputs.debdir }}
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.pin.outputs.version }}-${{ steps.aptkey.outputs.image }}

    - name: Install LLVM
      id: install
      if: runner.os == 'Linux' && steps.pin.outputs.version != ''
      shell: bash
      env:
        LLVM_VERSION: ${{ steps.pin.outputs.version }}
        ICL_DEB_CACHE: ${{ steps.pin.outputs.debdir }}
      run: | # zizmor: ignore[github-env] the value is the compiler major version pinned in the repository's own toolchain-versions.json
        set -euo pipefail
        timeout 900 sudo --preserve-env=LLVM_VERSION,ICL_DEB_CACHE bash "$GITHUB_ACTION_PATH/install-llvm.sh"
        echo "CC=clang-$LLVM_VERSION" >> "$GITHUB_ENV"
        echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
        # ASan and UBSan call llvm-symbolizer; the versioned name is not on PATH by default.
        echo "ASAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-$LLVM_VERSION" >> "$GITHUB_ENV"
        echo "TSAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-$LLVM_VERSION" >> "$GITHUB_ENV"

    # hashFiles() reads only files under GITHUB_WORKSPACE and the package directory is under $HOME, so a hashFiles test of
    # its .new marker was always empty and the save below never ran. The install script leaves .new when it downloaded
    # packages; this step turns that into an output for the save step to test.
    - name: Note whether packages were downloaded
      id: fresh
      if: runner.os == 'Linux' && steps.pin.outputs.version != ''
      shell: bash
      env:
        DEB_DIR: ${{ steps.pin.outputs.debdir }}
      run: |
        if [ -e "$DEB_DIR/.new" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi

    - name: Save the package cache
      if: >-
        runner.os == 'Linux' && steps.pin.outputs.version != '' && steps.debs.outputs.cache-hit != 'true'
        && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        && github.ref_name == github.event.repository.default_branch && steps.fresh.outputs.new == 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pin.outputs.debdir }}
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.pin.outputs.version }}-${{ steps.aptkey.outputs.image }}
