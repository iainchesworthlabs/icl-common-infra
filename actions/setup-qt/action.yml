name: Setup Qt
description: >-
  Install a prebuilt Qt kit with aqtinstall (through jurplel/install-qt-action)
  and export QT_ROOT_DIR, which cmake/FindQt6.cmake reads. Qt is never a vcpkg
  dependency.

inputs:
  version:
    description: >-
      Qt version, for example 6.12.0. When empty the action reads the `qt` key of
      .github/toolchain-versions.json in the checked-out repository, and installs nothing if that
      key is empty or the file is missing, so a job can carry this step in a project that has no Qt yet.
    default: ""
  modules:
    description: Space-separated Qt add-on modules, for example "qtquick3d qtshadertools".
    default: ""
  aqtsource:
    description: >-
      Optional aqtinstall source (pip requirement) used instead of the PyPI
      release. Needed on Windows for Qt 6.11 and later until a release newer
      than aqtinstall 3.3.0 exists. When `version` is read from
      .github/toolchain-versions.json, the `aqtsource` key of that file is used on Windows.
    default: ""
  target:
    description: aqtinstall target, desktop (default), android, ios or wasm.
    default: desktop
  arch:
    description: aqtinstall architecture. Empty lets the action choose the host default.
    default: ""
  host:
    description: aqtinstall host (linux, mac, windows). Empty means the runner's own.
    default: ""

runs:
  using: composite
  steps:
    - name: Read the pinned versions
      id: pins
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        AQTSOURCE: ${{ inputs.aqtsource }}
      run: |
        set -euo pipefail
        file=.github/toolchain-versions.json
        if [ -z "$VERSION" ] && [ -f "$file" ]; then
          VERSION="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('qt', ''))" "$file")"
          if [ -z "$AQTSOURCE" ] && [ "$RUNNER_OS" = Windows ]; then
            AQTSOURCE="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('aqtsource', ''))" "$file")"
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "aqtsource=$AQTSOURCE" >> "$GITHUB_OUTPUT"

    # install-qt-action installs its Linux packages with an unguarded `sudo apt-get update && install` that failed whole runs
    # (exit code 100) when the Ubuntu mirror was down. The same list is installed here from a cached package set, with a
    # retry, and the action is told to skip its own install. Only a push to the default branch, a manual run or a schedule
    # saves the cache; the key names the runner image.
    - name: Prepare the Qt runtime packages
      id: deps
      if: runner.os == 'Linux' && steps.pins.outputs.version != '' && inputs.host == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "debdir=$HOME/.cache/icl-apt/qt-deps" >> "$GITHUB_OUTPUT"

    - name: Restore the package cache
      id: debs
      if: steps.deps.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.deps.outputs.debdir }}
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-qt-deps-${{ env.ImageVersion }}

    - name: Install the Qt runtime packages
      if: steps.deps.outcome == 'success'
      shell: bash
      env:
        ICL_DEB_CACHE: ${{ steps.deps.outputs.debdir }}
      run: sudo --preserve-env=ICL_DEB_CACHE bash "$GITHUB_ACTION_PATH/install-deps.sh"

    - name: Install Qt
      if: steps.pins.outputs.version != ''
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: ${{ steps.pins.outputs.version }}
        modules: ${{ inputs.modules }}
        aqtsource: ${{ steps.pins.outputs.aqtsource }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        host: ${{ inputs.host }}
        cache: true
        install-deps: ${{ steps.deps.outcome == 'success' && 'false' || 'true' }}

    - name: Save the package cache
      if: >-
        steps.deps.outcome == 'success' && steps.debs.outputs.cache-hit != 'true'
        && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        && github.ref_name == github.event.repository.default_branch
        && hashFiles(format('{0}/.new', steps.deps.outputs.debdir)) != ''
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.deps.outputs.debdir }}
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-qt-deps-${{ env.ImageVersion }}
