name: Decide self-hosted vs GitHub-hosted runner
description: >-
  Counts online self-hosted runners (busy or not; repository level, plus
  organisation level when a token is given) carrying the given OS label, and
  picks self-hosted when any are online, GitHub-hosted otherwise. Online counts
  whether busy or idle because ephemeral runners deregister between jobs and
  vanish from the API for about ten seconds each time, so an idle-only count
  undercounts a fleet that is mostly free. Pull requests from forks always get
  GitHub-hosted runners: untrusted code never lands on a persistent runner.
  A failed or missing API response counts as zero and never fails the job.

inputs:
  os-label:
    description: "Linux or Windows - matched against the runner's own OS label."
    required: true
  hosted-json:
    description: 'GitHub-hosted fallback, as a JSON array, e.g. ["windows-latest"].'
    required: true
  mode:
    description: >-
      auto (live check), self-hosted, or github-hosted. An explicit value skips
      the live check. Callers usually pass a repository variable here.
    default: auto
  org-token:
    description: >-
      Optional org-scoped PAT/App token with "Self-hosted runners: read" on
      the organisation. Unset: only this repository's runner list is checked.
    required: false

outputs:
  runner:
    description: JSON array of labels for runs-on.
    value: ${{ steps.decide.outputs.runner }}

runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      # Every input read through env:, not interpolated straight into the
      # script text, the same reasoning setup-vcpkg's own action.yml gives
      # for VCPKG_COMMIT: a value substituted directly into a run: block is
      # shell CODE, not data (zizmor: template-injection).
      env:
        GH_TOKEN: ${{ github.token }}
        ORG_TOKEN: ${{ inputs.org-token }}
        REPO: ${{ github.repository }}
        ORG: ${{ github.repository_owner }}
        OS_LABEL: ${{ inputs.os-label }}
        HOSTED_JSON: ${{ inputs.hosted-json }}
        MODE: ${{ inputs.mode }}
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set -uo pipefail
        SELF_JSON="[\"self-hosted\",\"$OS_LABEL\",\"X64\"]"

        # Untrusted fork-PR code never touches self-hosted infra, full stop -
        # no live check needed.
        if [ "$IS_FORK_PR" = "true" ]; then
          echo "runner=$HOSTED_JSON" >> "$GITHUB_OUTPUT"
          echo "Fork PR - staying on GitHub-hosted."
          exit 0
        fi

        case "$MODE" in
          self-hosted)   echo "runner=$SELF_JSON" >> "$GITHUB_OUTPUT"; exit 0 ;;
          github-hosted) echo "runner=$HOSTED_JSON" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac

        # ONLINE runners
        # (busy or not - see the description above for why idleness is the
        # wrong predicate for an ephemeral fleet) carrying both
        # "self-hosted" and $OS_LABEL, summed across repo-level and (if
        # ORG_TOKEN is set) org-level lists. Never fails this step: a
        # missing/errored API response just counts as zero, so this check
        # being unavailable is never a reason to block the job. Every page
        # of the list is read.
        online_count() {
          local scope="$1" json count
          json="$(gh api --paginate "$scope/actions/runners?per_page=100" --jq '.runners[]' 2>/dev/null)" || { echo 0; return; }
          count="$(printf '%s' "$json" | jq -s "[.[] | select(.status==\"online\" and any(.labels[]; .name==\"self-hosted\") and any(.labels[]; .name==\"$OS_LABEL\"))] | length" 2>/dev/null)" || { echo 0; return; }
          echo "${count:-0}"
        }

        online="$(online_count "repos/$REPO")"
        if [ -n "${ORG_TOKEN:-}" ]; then
          online=$((online + $(GH_TOKEN="$ORG_TOKEN" online_count "orgs/$ORG")))
        fi

        if [ "$online" -ge 1 ]; then
          echo "runner=$SELF_JSON" >> "$GITHUB_OUTPUT"
          echo "$online online self-hosted $OS_LABEL runner(s) - using self-hosted."
        else
          echo "runner=$HOSTED_JSON" >> "$GITHUB_OUTPUT"
          echo "No online self-hosted $OS_LABEL runners - using GitHub-hosted."
        fi
