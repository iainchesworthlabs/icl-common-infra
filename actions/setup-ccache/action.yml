name: Setup ccache
description: >-
  Install ccache, restore its cache, and point CMake at it through
  CMAKE_C_COMPILER_LAUNCHER and CMAKE_CXX_COMPILER_LAUNCHER (CMake reads these
  environment variables as the initial value of the cache variables). Save the cache
  at the end of the job with actions/cache/save, `if: always() && env.CCACHE_SAVE == 'true'`,
  using the key this action exports as CCACHE_SAVE_KEY; CCACHE_SAVE says whether this job
  may write (see the cache-write input). MSVC builds with /Z7 (embedded debug info) or
  the compiler does not cache; presets for MSVC must set CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded.

inputs:
  key:
    description: Cache lineage, for example the leg name. Entries are keyed by lineage and commit.
    required: true
  max-size:
    description: Upper bound for the cache directory.
    default: 600M
  cache-write:
    description: >-
      Whether this job may save its ccache: "auto", "true" or "false", exported as
      CCACHE_SAVE. "auto" saves only on a push, scheduled or manual run of the default
      branch, the same rule as setup-vcpkg. A pull request or merge-queue run restores the
      default branch's entry and saves nothing: an entry saved on its ref is readable from
      that ref alone, and those entries were most of the quota (docs/using.md, "Actions cache").
    default: auto

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        set -euo pipefail
        if command -v ccache >/dev/null 2>&1; then exit 0; fi
        case "$RUNNER_OS" in
          Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ccache ;;
          macOS)   brew install ccache ;;
          Windows) choco install ccache -y --no-progress ;;
        esac

    - name: Configure ccache
      id: cfg
      shell: bash
      env:
        MAX_SIZE: ${{ inputs.max-size }}
        LINEAGE: ${{ inputs.key }}
      run: | # zizmor: ignore[github-env] values are runner-assigned paths and fixed settings
        set -euo pipefail
        dir="$RUNNER_TEMP/ccache"
        mkdir -p "$dir"
        if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -m "$dir")"; fi
        {
          echo "CCACHE_DIR=$dir"
          echo "CCACHE_MAXSIZE=$MAX_SIZE"
          echo "CCACHE_COMPRESS=1"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "prefix=ccache-$RUNNER_OS-$RUNNER_ARCH-$LINEAGE-" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cfg.outputs.dir }}
        key: ${{ steps.cfg.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.cfg.outputs.prefix }}

    - name: Export the save key
      shell: bash
      env:
        PREFIX: ${{ steps.cfg.outputs.prefix }}
        CACHE_WRITE: ${{ inputs.cache-write }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: | # zizmor: ignore[github-env] runner OS, arch, lineage, commit SHA and a literal true/false only
        set -euo pipefail
        case "$CACHE_WRITE" in
          true | false) write="$CACHE_WRITE" ;;
          auto)
            write=false
            case "$EVENT" in
              push | schedule | workflow_dispatch)
                if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then write=true; fi ;;
            esac ;;
          *) echo "::error::cache-write must be auto, true or false, not '$CACHE_WRITE'"; exit 1 ;;
        esac
        echo "CCACHE_SAVE_KEY=${PREFIX}${GITHUB_SHA}" >> "$GITHUB_ENV"
        echo "CCACHE_SAVE=$write" >> "$GITHUB_ENV"
        echo "ccache: this job $([ "$write" = true ] && echo writes || echo only restores)"
