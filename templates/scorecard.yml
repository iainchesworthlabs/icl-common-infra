# SPDX-License-Identifier: GPL-3.0-or-later
#
# Belongs in a project at .github/workflows/scorecard.yml. It is a template and not a reusable
# workflow because of the restrictions Scorecard's API puts on a workflow that publishes: the
# analysis job holds only checkout, upload-sarif and scorecard-action steps, on a hosted Ubuntu
# runner, with no top-level env or defaults, no write permission at the top and
# `id-token: write` on that job only. They are written for a job that holds those steps itself,
# and adding a `run:` step here makes the API reject the result and leaves the README badge red.
#
# Supply-chain health score of the published repository, from OpenSSF Scorecard. It runs on the
# default branch only (the badge reads "invalid repo path" until a run there has published a
# result), and is visible only: a score and a badge, not a pass/fail check. `branch_protection_rule`
# re-runs the analysis when the rulesets change, so the score follows them.
#
# The branch-protection check needs read access to the repository's settings to score fully;
# without a token it degrades rather than fails. For the fuller score, store a fine-grained
# personal access token (read only, "Administration: read") as the repository secret
# SCORECARD_READ_TOKEN and uncomment repo_token below. Replace `main` with the repository's
# release branch if it is not called that.

name: OSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
