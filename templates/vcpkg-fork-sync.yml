#
# Belongs in iainchesworthlabs/vcpkg at .github/workflows/sync-upstream.yml, on the fork's
# default branch `icl-sync`.
#
# `master` in the fork stays an exact copy of microsoft/vcpkg master, so that every upstream
# commit a Dependabot baseline bump can name is reachable from it (the `vcpkg-baseline-in-fork`
# policy check fails a pull request until it is). A scheduled workflow runs from the default
# branch, so the workflow lives on `icl-sync` and keeps `master` free of local commits.
# Custom ports live on their own branches or in an overlay directory, never on master.
#
# The sync is GitHub's server-side fork sync (a fast-forward). It fails when master has a
# local commit, which is the signal to remove that commit. When upstream changes a file under
# .github/workflows, GitHub may refuse the update for the Actions token; then store a
# personal access token with the `workflow` scope as the repository secret SYNC_TOKEN.
name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fast-forward master from upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master
